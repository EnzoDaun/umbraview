# Publica o site no GitHub Pages a cada push na main (ou pelo botão "Run workflow").
#
# Duas configurações do repositório, fora deste arquivo, precisam continuar assim:
# - Settings > Pages > Source: GitHub Actions.
# - Settings > Environments > github-pages: só a main pode publicar. O GitHub cria esse
#   ambiente liberando só a branch padrão, que aqui é a develop, e aí o deploy é recusado com
#   'Branch "main" is not allowed to deploy to github-pages' (visto em 14/11/2026).
#
# No plano gratuito do GitHub, o Pages só existe em repositório público: se o repositório
# voltar a ser privado, os dois trabalhos são pulados, e não reprovados.
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Uma publicação por vez, e a que está no meio termina: cancelar no meio deixaria o site pela
# metade.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # O verify inteiro, e não só o build: o que vai para os juízes passa pela conferência do
      # TODO_PREENCHER.
      - run: npm run verify
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
